<!doctype html>
<html lang="en" data-skin="sunrise">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICU Round</title>
<meta name="theme-color" content="#ff5f45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ICU Round">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{--font:'Poppins';--fw:400;--scale:1}
:root,html[data-skin=sunrise]{--bg:#fff6ef;--s1:#fff;--s2:#fff0e5;--tx:#2b1d16;--mu:#8f7768;--ln:#f2dfd1;--p1:#ff5f45;--p2:#ffa63d;--sh:0 8px 22px -12px rgba(214,92,52,.45);--crit:#e8384f;--ser:#f08c00;--stb:#2b9e5f;color-scheme:light}
html[data-skin=sky]{--bg:#eef5ff;--s1:#fff;--s2:#e4efff;--tx:#14233b;--mu:#62748f;--ln:#d8e5f7;--p1:#2f6bff;--p2:#22c1e8;--sh:0 8px 22px -12px rgba(47,107,255,.45);--crit:#e8384f;--ser:#f08c00;--stb:#2b9e5f;color-scheme:light}
html[data-skin=mint]{--bg:#ecfaf3;--s1:#fff;--s2:#dff5e9;--tx:#11291f;--mu:#5d7d6e;--ln:#cfeadc;--p1:#0ca678;--p2:#3bc9db;--sh:0 8px 22px -12px rgba(12,166,120,.45);--crit:#e8384f;--ser:#f08c00;--stb:#2b9e5f;color-scheme:light}
html[data-skin=candy]{--bg:#fbf0ff;--s1:#fff;--s2:#f4e4ff;--tx:#2a1638;--mu:#86709a;--ln:#ecd9f7;--p1:#e64980;--p2:#7048e8;--sh:0 10px 24px -12px rgba(112,72,232,.5);--crit:#e8384f;--ser:#f08c00;--stb:#2b9e5f;color-scheme:light}
html[data-skin=ocean]{--bg:#081a33;--s1:#0f2a50;--s2:#163762;--tx:#e9f2ff;--mu:#8ea8cc;--ln:#1e406f;--p1:#00a8f0;--p2:#7b5cff;--sh:0 12px 26px -14px rgba(0,0,0,.7);--crit:#ff5c70;--ser:#ffb020;--stb:#3ddc84;color-scheme:dark}
html[data-skin=royal]{--bg:#170c2b;--s1:#24143f;--s2:#301c55;--tx:#f4ecff;--mu:#a593c4;--ln:#3a2662;--p1:#a855f7;--p2:#ff5fa8;--sh:0 12px 26px -14px rgba(0,0,0,.7);--crit:#ff5c70;--ser:#ffb020;--stb:#3ddc84;color-scheme:dark}
html[data-skin=midnight]{--bg:#0b0f17;--s1:#141a25;--s2:#1c2433;--tx:#dfe5ef;--mu:#7f8a9d;--ln:#232c3c;--p1:#3d7bff;--p2:#9b6bff;--sh:0 12px 26px -14px rgba(0,0,0,.8);--crit:#ff5c70;--ser:#ffb020;--stb:#3ddc84;color-scheme:dark}
html[data-skin=amoled]{--bg:#000;--s1:#0c0c0e;--s2:#17171b;--tx:#e8e8ea;--mu:#85858d;--ln:#202026;--p1:#0fb5c6;--p2:#e0479e;--sh:none;--crit:#ff5c70;--ser:#ffb020;--stb:#3ddc84;color-scheme:dark}
html[data-skin=rednight]{--bg:#0a0101;--s1:#170504;--s2:#220806;--tx:#ff9d8f;--mu:#a6584d;--ln:#3a120c;--p1:#b3261a;--p2:#6e110a;--sh:none;--crit:#ff3b2f;--ser:#e0703a;--stb:#b8644f;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font),'Hind Siliguri',system-ui,-apple-system,sans-serif;font-weight:var(--fw);min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom) + 20px);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3{margin:0;font-weight:700}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ico.fill svg{fill:currentColor;stroke:none}

/* header */
.top{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 18px;border-radius:0 0 26px 26px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.top h1{font-size:1.35rem;line-height:1.15}
.top .sub{font-size:.8rem;opacity:.92;margin-top:2px}
.hbtns{display:flex;gap:8px}
.hbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);border:0;color:#fff;display:grid;place-items:center;flex:none}
.hbtn:active{background:rgba(255,255,255,.35)}

.stats{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:8px 13px;min-width:max-content;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.2rem;line-height:1.2}
.stat span{font-size:.72rem;color:var(--mu);font-weight:600}
.stat.k1 b{color:var(--p1)}.stat.k2 b{color:var(--crit)}.stat.k3 b{color:#9c5cf5}.stat.k4 b{color:#f76707}
html[data-skin=rednight] .stat b{color:var(--tx)!important}

.banner{margin:0 14px 12px;background:#fff3bf;color:#5c4400;border-radius:14px;padding:10px 12px;font-weight:600;font-size:.85rem;display:flex;gap:8px;align-items:center;border:0;width:calc(100% - 28px);text-align:left}
html[data-skin=rednight] .banner{background:#2a0a06;color:var(--tx)}

.toolbar{display:flex;justify-content:space-between;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mu);font-size:.8rem;font-weight:600;padding:7px 11px;border-radius:9px}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.14)}

.gtitle{padding:4px 18px 8px;font-weight:700;font-size:.78rem;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.gtitle i{width:9px;height:9px;border-radius:50%;background:var(--mu)}
.gtitle.critical i{background:var(--crit)}.gtitle.serious i{background:var(--ser)}.gtitle.stable i{background:var(--stb)}

/* cards */
.grid{display:grid;gap:12px;padding:0 14px 22px}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.grid.m{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.grid.l{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{position:relative;background:var(--s1);border-radius:18px;padding:14px 12px 12px;box-shadow:var(--sh);border:1px solid var(--ln);overflow:hidden;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:6px;transition:transform .12s;min-width:0}
.card:active{transform:scale(.97)}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--g1),var(--g2))}
.card.s{padding:12px 9px 9px;border-radius:15px;gap:4px}
.card.l{padding:16px 14px 14px;gap:8px}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bedno{display:inline-block;font-weight:700;font-size:1.02rem;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));padding:3px 10px;border-radius:10px;letter-spacing:.3px;white-space:nowrap}
.card.s .bedno{font-size:.9rem;padding:2px 8px}
.c-name{font-weight:700;font-size:1rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name small{font-weight:500;color:var(--mu);font-size:.8rem}
.card.s .c-name{font-size:.86rem}
.c-dx{font-size:.82rem;color:var(--mu);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-ct{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:2px}
.c-last{font-size:.82rem;background:var(--s2);border-radius:10px;padding:8px 9px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.empty{border:1.5px dashed var(--ln);background:transparent;box-shadow:none;min-height:92px}
.card.s.empty{min-height:74px}
.card.empty::before{opacity:.35}
.card.empty .bedno{background:var(--s2);color:var(--mu)}
.empty-l{margin-top:auto;color:var(--mu);font-weight:600;font-size:.82rem;display:flex;align-items:center;gap:4px}
.empty-l .ico svg{width:16px;height:16px}
.card.st-critical{border-color:color-mix(in srgb,var(--crit) 60%,transparent);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--crit) 45%,transparent),var(--sh)}

html[data-skin=ocean] .card.occ,html[data-skin=royal] .card.occ,html[data-skin=midnight] .card.occ,html[data-skin=amoled] .card.occ{background:linear-gradient(165deg,color-mix(in srgb,var(--g1) 24%,var(--s1)),var(--s1) 62%)}
html[data-skin=candy] .card.occ{background:linear-gradient(145deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
html[data-skin=candy] .card.occ::before{display:none}
html[data-skin=candy] .card.occ .bedno{background:rgba(255,255,255,.26)}
html[data-skin=candy] .card.occ .c-dx,html[data-skin=candy] .card.occ .c-name small{color:rgba(255,255,255,.88)}
html[data-skin=candy] .card.occ .ct{background:rgba(255,255,255,.24)!important;color:#fff!important}
html[data-skin=candy] .card.occ .ct.afeb.warn{background:#fff3bf!important;color:#5c4400!important}
html[data-skin=candy] .card.occ .st{background:#fff!important}
html[data-skin=candy] .card.occ .c-last{background:rgba(255,255,255,.2)}

/* status pill */
.st{font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;border:0}
.st.critical{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.st.serious{background:color-mix(in srgb,var(--ser) 18%,transparent);color:var(--ser)}
.st.stable{background:color-mix(in srgb,var(--stb) 16%,transparent);color:var(--stb)}
.card.s .st{width:11px;height:11px;padding:0;border-radius:50%}
.card.s .st.critical{background:var(--crit)}.card.s .st.serious{background:var(--ser)}.card.s .st.stable{background:var(--stb)}

/* counters */
.ct{font-size:.7rem;font-weight:700;padding:3px 7px;border-radius:8px;white-space:nowrap}
.ct.hosp{background:color-mix(in srgb,#5c7cfa 15%,transparent);color:#5c7cfa}
.ct.icu{background:color-mix(in srgb,var(--p1) 15%,transparent);color:var(--p1)}
.ct.ett{background:color-mix(in srgb,#9c5cf5 16%,transparent);color:#9c5cf5}
.ct.den{background:color-mix(in srgb,#f76707 15%,transparent);color:#f76707}
.ct.afeb{background:color-mix(in srgb,#2b9e5f 15%,transparent);color:#2b9e5f}
.ct.afeb.warn{background:#ffe066;color:#5c4400}
html[data-skin=ocean] .ct.icu,html[data-skin=royal] .ct.icu,html[data-skin=midnight] .ct.icu,html[data-skin=amoled] .ct.icu{color:color-mix(in srgb,var(--p1) 70%,#fff)}
html[data-skin=rednight] .ct{background:#2a0a06!important;color:var(--tx)!important}
html[data-skin=rednight] .ct.afeb.warn{background:#5a1a10!important}
.big .ct{font-size:.85rem;padding:6px 11px;border-radius:11px}

/* patient page */
.ptop{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 12px 18px;border-radius:0 0 26px 26px;display:flex;align-items:flex-start;gap:10px}
.pt-main{flex:1;min-width:0}
.pt-bed{font-size:.78rem;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.8px}
.pt-name{font-size:1.3rem;font-weight:700;line-height:1.2;margin-top:2px;word-break:break-word}
.pt-name small{font-size:.85rem;font-weight:500;opacity:.9}
.pt-dx{font-size:.88rem;opacity:.92;margin-top:2px}
.pt-st{margin-top:8px}
.pt-st .st{background:#fff!important;font-size:.7rem;padding:4px 10px}
.ctr-row{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 4px}
.arch-note{margin:10px 14px 0;padding:10px 12px;border-radius:14px;background:var(--s2);font-size:.85rem;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:var(--bg)}
/* investigation */
.labbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 14px 2px}
.lgrp{background:var(--s1);border:1px solid var(--ln);border-radius:16px;margin:0 14px 10px;box-shadow:var(--sh);overflow:hidden}
.lgrp summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;background:linear-gradient(90deg,color-mix(in srgb,var(--p1) 13%,transparent),transparent 80%)}
.lgrp summary::-webkit-details-marker{display:none}
.lgrp summary small{color:var(--mu);font-weight:700;font-size:.75rem}
.lcols,.lrow{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(0,76px));gap:5px;align-items:center;padding-left:12px;padding-right:10px}
.lcols{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin:0 14px 8px;padding-top:6px;padding-bottom:6px;border:1px solid transparent}
.lc0{font-size:.66rem;color:var(--mu);font-weight:600;line-height:1.2}
.colb{border:1.5px solid var(--ln);background:var(--s1);border-radius:11px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:0}
.colb b{font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.colb small{font-size:.6rem;color:var(--mu);font-weight:600}
.colb.today{border-color:var(--p1);background:color-mix(in srgb,var(--p1) 10%,var(--s1))}
.colb.pm b{color:#7048e8}
.lrow{padding-top:5px;padding-bottom:5px;border-top:1px solid var(--ln)}
.lcell{position:relative;min-width:0}
.lcell .tr{position:absolute;left:5px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--mu);font-style:normal;font-weight:700;pointer-events:none;z-index:1}
.lname{border:0;background:none;text-align:left;font-weight:600;font-size:.9rem;padding:4px 0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.lname small{font-size:.66rem;color:var(--mu);font-weight:500;margin-top:1px}
.lstar{color:#f59f00;font-style:normal;margin-right:3px}
.lin{padding:8px 7px 8px 15px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;border-radius:10px;min-height:40px}
.lin:disabled{opacity:1;background:var(--s2)}
.lin.hi,.lin.lo,.lprev.hi,.lprev.lo{color:var(--crit)}
.lprev{text-align:right;font-size:.85rem;color:var(--mu);font-weight:600;font-variant-numeric:tabular-nums;padding:4px 5px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltr{font-size:.8rem;color:var(--mu);font-weight:700;text-align:center}
.mk-red{background:#ffc9c9!important;color:#8a0d0d!important}
.mk-yellow{background:#ffec99!important;color:#5c4400!important}
.mk-green{background:#b2f2bb!important;color:#0b4a1d!important}
.mk-blue{background:#a5d8ff!important;color:#0b3a66!important}
.mk-purple{background:#e5dbff!important;color:#3b1a7a!important}
.mkrow{display:flex;flex-wrap:wrap;gap:8px}
.mkb{border:2px solid var(--ln);border-radius:12px;padding:8px 13px;font-weight:700;font-size:.82rem;background:var(--s1)}
.mkb.on{outline:3px solid var(--p1);outline-offset:1px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed var(--ln);font-size:.9rem}
.hrow b{padding:1px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
.hrow b.hi,.hrow b.lo{color:var(--crit)}
.impl{display:flex;flex-wrap:wrap;gap:8px}
.impc{border:1px solid var(--ln);background:var(--s2);border-radius:12px;padding:6px 11px;display:flex;flex-direction:column;align-items:flex-start;min-width:84px;line-height:1.25}
.impc b{font-size:.72rem;color:var(--mu)}
.impc span{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.impc small{font-size:.66rem;color:var(--mu)}
.impc.hi span,.impc.lo span{color:var(--crit)}
.ldg{border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:12px;background:var(--s1)}
.ldg-h{display:flex;gap:8px;margin-bottom:4px}
.ldg-h input{font-weight:700}
.ldt{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;padding:8px 0;border-top:1px dashed var(--ln);align-items:end}
.ldt .n{grid-column:1/4}
.ldt input{padding:8px 9px}
.mini span{display:block;font-size:.66rem;color:var(--mu);font-weight:600;margin-bottom:2px}
.c-imp{font-size:.76rem;font-weight:600;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 10px}
.c-imp b{color:var(--tx)}
.c-imp b.hi,.c-imp b.lo{color:var(--crit)}
html[data-skin=candy] .card.occ .c-imp,html[data-skin=candy] .card.occ .c-imp b{color:#fff}
/* serology & culture */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;border:0;border-top:1px solid var(--ln);background:none;padding:11px 2px;text-align:left;width:100%}
.slist .srow:first-child{border-top:0}
.sn{font-weight:600;font-size:.92rem;min-width:0}
.sn small{display:block;color:var(--mu);font-size:.72rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{font-size:.72rem;color:var(--mu);font-weight:600;white-space:nowrap}
.res{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.r-positive{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.r-negative{background:color-mix(in srgb,var(--stb) 16%,transparent);color:var(--stb)}
.r-pending{background:var(--s2);color:var(--mu)}
.r-equivocal{background:color-mix(in srgb,var(--ser) 18%,transparent);color:var(--ser)}
.chip.k-Positive.on{background:var(--crit)}.chip.k-Negative.on{background:var(--stb)}.chip.k-Equivocal.on{background:var(--ser)}
.bf{border-top:1px dashed var(--ln);padding:10px 0 4px}
.bfl{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;padding:2px 0}
.bfl span{color:var(--mu);flex:none}
.bfl b{text-align:right;overflow-wrap:anywhere}
.cs{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:0 14px 10px;box-shadow:var(--sh)}
.cs-type{font-size:.75rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));padding:3px 10px;border-radius:9px;white-space:nowrap}
.cs-main{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 8px}
.cs-org{font-size:1rem;font-style:italic}
.cs-main small{color:var(--mu);font-size:.78rem}
.cst{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:20px}
.s-pending{background:var(--s2);color:var(--mu)}
.s-no-growth{background:color-mix(in srgb,var(--stb) 16%,transparent);color:var(--stb)}
.s-growth{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.abxs{display:flex;flex-wrap:wrap;gap:5px}
.ab{font-size:.74rem;font-weight:600;padding:3px 8px;border-radius:8px}
.ab-S{background:color-mix(in srgb,var(--stb) 15%,transparent);color:var(--stb)}
.ab-I{background:color-mix(in srgb,var(--ser) 17%,transparent);color:var(--ser)}
.ab-R{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.abxpick{display:flex;flex-wrap:wrap;gap:6px}
.abc{border:1.5px solid var(--ln);background:var(--s1);border-radius:10px;padding:7px 10px;font-size:.8rem;font-weight:600}
.abc b{margin-left:5px}
.abc.r-S{background:var(--stb);color:#fff;border-color:transparent}

.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}

.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.danger{background:var(--crit);color:#fff}
.btn.sm{padding:7px 12px;font-size:.8rem;border-radius:10px}

.btn.wide{width:100%}

.dgroup{margin-bottom:6px}
.dhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:6px 18px 8px;color:var(--mu);font-size:.8rem;list-style:none;cursor:pointer}
.dhead::-webkit-details-marker{display:none}
.dhead .dl{display:flex;align-items:center;gap:6px}

.entry{background:var(--s1);border:1px solid var(--ln);border-left:4px solid var(--p1);border-radius:14px;padding:10px 12px;margin:0 14px 10px;box-shadow:var(--sh)}

html[data-skin=rednight] .e-dept{color:var(--tx);background:var(--s2)}
.ctab{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--ln);font-size:.88rem}
.ctab .crow:first-child{border-top:0}
.crow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow small{color:var(--mu);font-size:.72rem;white-space:nowrap}
.e-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.e-time{font-size:.75rem;font-weight:700;color:var(--mu)}

.ibtn{width:34px;height:34px;border-radius:10px;border:0;background:var(--s2);color:var(--mu);display:grid;place-items:center}

.ibtn.del:active{color:var(--crit)}
.emptystate{text-align:center;color:var(--mu);padding:30px 20px;font-size:.9rem}

.rich{line-height:1.55;overflow-wrap:anywhere}
.rich ul,.rich ol{padding-left:1.35em;margin:.25em 0}
.rich p{margin:0}
.rich [style*="background-color"]{color:#1d1d1d;border-radius:3px;padding:0 2px}
.rich font[size="1"]{font-size:.7em}.rich font[size="2"]{font-size:.85em}.rich font[size="4"]{font-size:1.15em}.rich font[size="5"]{font-size:1.35em}.rich font[size="6"]{font-size:1.7em}.rich font[size="7"]{font-size:2.2em}

.panel{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:0 14px 12px;box-shadow:var(--sh)}
.pan-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pan-h h3{font-size:1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.9rem}
.kv dt{color:var(--mu);font-weight:600}
.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.kv dd b{color:var(--p1)}
.bigline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bigline .lbl{font-size:.88rem;color:var(--mu);font-weight:600}
.bigline .val{font-size:1.5rem;font-weight:700}
.hist{margin-top:10px;font-size:.82rem;color:var(--mu)}
.hist div{padding:6px 0;border-top:1px dashed var(--ln)}
.drow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:10px}
.drow .cnt{font-size:1.2rem;font-weight:700;padding-bottom:8px;min-width:70px;text-align:right}
.drow .cnt.warn{color:#e67700}
.hint{font-size:.76rem;color:var(--mu);margin-top:4px}

/* archive */
.search{padding:0 14px 12px}
.arow{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:0 14px 10px;cursor:pointer;box-shadow:var(--sh)}
.a-bed{min-width:56px;text-align:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:12px;padding:10px 6px;font-size:.9rem}
.a-main{flex:1;min-width:0}
.a-main b{font-size:.95rem}
.a-main small{color:var(--mu)}
.a-dx{font-size:.82rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-meta{font-size:.75rem;color:var(--mu);margin-top:3px}
.oc{font-size:.68rem;font-weight:700;padding:4px 8px;border-radius:9px;white-space:nowrap;align-self:flex-start}
.oc-discharge{background:color-mix(in srgb,var(--stb) 16%,transparent);color:var(--stb)}
.oc-ward-transfer{background:color-mix(in srgb,#3b82f6 16%,transparent);color:#3b82f6}
.oc-death{background:color-mix(in srgb,var(--mu) 22%,transparent);color:var(--tx)}
.oc-dama{background:color-mix(in srgb,var(--ser) 18%,transparent);color:var(--ser)}

/* sheets */
.wrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;z-index:50}
.wrap.open{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .22s ease-out;overflow:hidden}
.wrap.open .sheet{transform:none}
.sheet.full{height:100dvh;max-height:100dvh;border-radius:0}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet.full .sh-head{padding-top:calc(env(safe-area-inset-top) + 10px)}
.sh-head h2{flex:1;font-size:1.12rem;min-width:0}
.sh-head .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--s2);font-size:1rem;flex:none}
.sh-sub{font-size:.85rem;color:var(--mu);padding:0 16px 8px;margin-top:-6px}
.sh-body{overflow:auto;padding:4px 16px 16px;flex:1;-webkit-overflow-scrolling:touch}
.sh-foot{display:flex;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--ln);background:var(--bg)}
.sh-foot .btn{flex:1}
@media(min-width:700px){.wrap{align-items:center}.sheet{border-radius:24px;max-height:88vh}.sheet.full{height:88vh;border-radius:24px}.sheet.full .sh-head{padding-top:16px}}

.f{display:block;margin-bottom:13px;min-width:0}
.f>span{display:block;font-size:.78rem;font-weight:600;color:var(--mu);margin-bottom:5px}
input,select,textarea{width:100%;min-width:0;font:inherit;font-size:max(16px,1rem);color:var(--tx);background:var(--s1);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date],input[type=time]{min-height:46px;display:block}
input:focus,select:focus,textarea:focus{border-color:var(--p1)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--ln);background:var(--s1);font-size:.86rem;font-weight:600;padding:8px 13px;border-radius:20px}
.chip.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
.chip.k-critical.on{background:var(--crit)}.chip.k-serious.on{background:var(--ser)}.chip.k-stable.on{background:var(--stb)}
.sw{display:flex;align-items:center;gap:11px;padding:8px 0;font-weight:600;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{width:48px;height:28px;border-radius:20px;background:var(--ln);position:relative;transition:.2s;flex:none}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--p1)}
.sw input:checked+i::after{transform:translateX(20px)}
.sub-f{padding:6px 0 2px 14px;border-left:3px solid var(--ln);margin:2px 0 10px}

.menu{display:flex;flex-direction:column;gap:8px;padding:0 16px calc(env(safe-area-inset-bottom) + 18px)}
.menu button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--ln);background:var(--s1);border-radius:14px;padding:13px 14px;font-weight:600;font-size:.95rem}
.menu button small{display:block;font-weight:500;color:var(--mu);font-size:.76rem;margin-top:1px}
.menu button.danger{color:var(--crit)}
.menu .ico{flex:none}

/* editor */
.ed-meta{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
.ed-meta input{flex:1;min-width:120px}
.ed-meta input[name=by]{flex-basis:100%}
.tb{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);background:var(--s1);align-items:center}
.tb button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--s2);font-weight:700;padding:0 8px;display:grid;place-items:center}
.tb button:active{background:var(--ln)}
.tb .sep{width:1px;height:24px;background:var(--ln);margin:0 2px}
.tb .lb{font-size:.7rem;font-weight:700;color:var(--mu);margin-right:-2px}
.tb .swc{width:30px;min-width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--ln)}
.tb .sz.s{font-size:.72rem}.tb .sz.m{font-size:.92rem}.tb .sz.l{font-size:1.15rem}.tb .sz.xl{font-size:1.4rem}
.tb .ico svg{width:18px;height:18px}
.ed{flex:1;overflow:auto;padding:14px 16px 40px;outline:none;font-size:1.02rem;-webkit-overflow-scrolling:touch;min-height:180px}
.ed:empty::before{content:attr(data-ph);color:var(--mu)}

/* settings */
.sec{margin-bottom:18px}
.sec h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);margin-bottom:9px}
.thm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thm button{border:2px solid var(--ln);border-radius:14px;padding:7px;background:var(--s1);font-size:.76rem;font-weight:600;text-align:left}
.thm button.on{border-color:var(--p1);box-shadow:0 0 0 2px color-mix(in srgb,var(--p1) 30%,transparent)}
.thm .pv{height:38px;border-radius:9px;margin-bottom:6px;display:flex;align-items:flex-end;gap:4px;padding:5px}
.thm .pv i{width:14px;height:14px;border-radius:5px}
.thm small{display:block;color:var(--mu);font-weight:500;font-size:.68rem}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{min-width:56px;text-align:center}
.bedrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bedrow input{width:110px;flex:none;font-weight:700}
.bedrow .occ{flex:1;font-size:.85rem;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bedrow .occ.o{color:var(--tx);font-weight:600}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pickgrid button{border:0;border-radius:12px;padding:12px 6px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,20px);background:#222;color:#fff;padding:11px 18px;border-radius:14px;font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (max-width:430px){.top .logo{display:none}.hbtns{gap:6px}.hbtn{width:38px;height:38px}}
.pdfout{margin-top:14px}
.pdfcard{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:12px}
.pdfcard .ico{color:var(--crit)}.pdfcard b{display:block;font-size:.85rem;overflow-wrap:anywhere}.pdfcard small{color:var(--mu);font-size:.75rem}
.rp-tools{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.rp-tools input{flex:1 1 140px;width:auto}
.rp{padding:0 14px 20px}
.rp-title{margin-bottom:12px}.rp-title h2{font-size:1.1rem}.rp-title div{font-size:.82rem;color:var(--mu)}
.rp-bed{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh);break-inside:avoid}
.rp-h{display:flex;gap:10px;align-items:center}
.rp-no{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-weight:700;border-radius:10px;padding:5px 10px;flex:none}
.rp-h small{color:var(--mu)}.rp-dx{font-size:.82rem;color:var(--mu)}
.rp-meta{font-size:.74rem;color:var(--mu);margin:8px 0 2px;font-weight:600}
.rp-sec{margin-top:10px}.rp-sec h4{margin:0 0 4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--mu)}
.rp-by{font-size:.75rem;font-weight:700;color:#7048e8}.rp-note{margin-bottom:6px;font-size:.9rem}
.rp-lab{border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
.rp-lab th,.rp-lab td{border:1px solid var(--ln);padding:4px 8px;text-align:right}
.rp-lab th:first-child,.rp-lab tbody th{text-align:left;font-weight:600}.rp-lab small{color:var(--mu);font-weight:400}
.rp-lab .pv{color:var(--mu)}.rp-lab .hi,.rp-lab .lo{color:var(--crit);font-weight:700}
.rp-sec:has(.rp-lab){overflow-x:auto}
.rp-line{font-size:.88rem;margin-bottom:6px}.rp-abx{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.rp-serol{display:flex;flex-direction:column;gap:3px;font-size:.88rem}
@media print{
  .noprint,#toast,#sheets,.preview-note{display:none!important}
  html,body{background:#fff!important;color:#111!important}
  .rp-bed{box-shadow:none;border-color:#ccc;background:#fff}
  .rp-no{background:#ff5f45!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .mk-red,.mk-yellow,.mk-green,.mk-blue,.mk-purple,.ab{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ================= dates ================= */
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowTime(){ const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function diff(a, b){ // days from a to b
  const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / 864e5);
}
function fmtD(s, year=true){ if(!s) return '—'; const [y,m,d] = s.split('-').map(Number); return `${d} ${MON[m-1]}${year ? ' ' + y : ''}`; }
function fmtLong(s){ const [y,m,d] = s.split('-').map(Number); return `${WD[new Date(y,m-1,d).getDay()]}, ${d} ${MON[m-1]} ${y}`; }
function dayN(from, ref){ if(!from) return null; const n = diff(from, ref) + 1; return n >= 1 ? n : null; }

function ctrs(p, refDate){
  const ref = refDate || (p.discharge ? p.discharge.date : todayStr());
  const c = {hosp: dayN(p.hospDate, ref), icu: dayN(p.icuDate, ref)};
  if (p.ett && !p.ett.ext) c.ett = dayN(p.ett.date, ref);
  if (p.dengue && p.dengue.on){
    c.dengue = dayN(p.dengue.onset, ref);
    if (p.dengue.lastFever){ const a = diff(p.dengue.lastFever, ref); if (a >= 0) c.afeb = a; }
  }
  return c;
}
function ctrChips(p, mode){
  const c = ctrs(p), o = [], s = mode === 's';
  if (!s && c.hosp) o.push(`<span class="ct hosp">Hosp D${c.hosp}</span>`);
  if (c.icu) o.push(`<span class="ct icu">ICU D${c.icu}</span>`);
  if (c.ett) o.push(`<span class="ct ett">ETT D${c.ett}</span>`);
  if (c.dengue) o.push(`<span class="ct den">${s ? 'DEN' : 'Dengue'} D${c.dengue}</span>`);
  if (c.afeb != null) o.push(`<span class="ct afeb ${c.afeb <= 2 ? 'warn' : ''}">${s ? 'AF' : 'Afebrile'} D${c.afeb}</span>`);
  return o.join('');
}

/* ================= sanitize rich text ================= */
const OK_TAGS = new Set(['B','STRONG','I','EM','U','S','STRIKE','SPAN','FONT','BR','DIV','P','UL','OL','LI','MARK','SUB','SUP']);
const OK_CSS = ['color','background-color','font-size','font-weight','font-style','text-decoration','text-decoration-line'];
function clean(html){
  const doc = new DOMParser().parseFromString(`<div id="r">${html || ''}</div>`, 'text/html');
  const root = doc.getElementById('r');
  (function walk(node){
    [...node.children].forEach(el => {
      if (['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META'].includes(el.tagName)){ el.remove(); return; }
      walk(el);
      if (!OK_TAGS.has(el.tagName)){ el.replaceWith(...el.childNodes); return; }
      const css = [];
      for (const prop of OK_CSS){ const v = el.style.getPropertyValue(prop); if (v) css.push(`${prop}:${v}`); }
      const color = el.getAttribute('color'), size = el.getAttribute('size');
      [...el.attributes].forEach(a => el.removeAttribute(a.name));
      if (css.length) el.setAttribute('style', css.join(';'));
      if (el.tagName === 'FONT'){ if (color) el.setAttribute('color', color); if (size) el.setAttribute('size', size); }
    });
  })(root);
  return root.innerHTML;
}

/* ================= toast / sheets ================= */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

function sheet(html, {full=false, onClose=null} = {}){
  const el = document.createElement('div');
  el.className = 'wrap';
  el.innerHTML = `<div class="sheet ${full ? 'full' : ''}" role="dialog">${html}</div>`;
  el._onClose = onClose;
  $('#sheets').appendChild(el);
  requestAnimationFrame(() => el.classList.add('open'));
  el.addEventListener('click', e => {
    if (e.target === el && !full) return closeSheet(el);
    const chip = e.target.closest('.chips .chip');
    if (chip){
      const g = chip.parentElement;
      if ('multi' in g.dataset){
        chip.classList.toggle('on');
        g.dataset.value = [...g.querySelectorAll('.chip.on')].map(x => x.dataset.v).join(',');
      } else {
        g.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === chip));
        g.dataset.value = chip.dataset.v;
      }
      g.dispatchEvent(new Event('change', {bubbles:true}));
    }
    if (e.target.closest('[data-close]')) closeSheet(el);
  });
  el.addEventListener('change', e => {
    const t = e.target;
    if (t.type === 'checkbox' && t.name) el.querySelectorAll(`[data-show="${t.name}"]`).forEach(s => s.hidden = !t.checked);
  });
  return el;
}
function closeSheet(el){
  if (!el || el._closing) return; el._closing = true;
  if (el._onClose) el._onClose();
  el.classList.remove('open'); setTimeout(() => el.remove(), 220);
}
function confirmBox(msg, ok='Confirm', danger=false, sub=''){
  return new Promise(res => {
    const el = sheet(`<div class="sh-head"><h2>${esc(msg)}</h2></div>${sub ? `<div class="sh-sub">${esc(sub)}</div>` : ''}
      <div class="sh-foot"><button class="btn ghost" data-no>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(ok)}</button></div>`);
    el.querySelector('[data-no]').onclick = () => { closeSheet(el); res(false); };
    el.querySelector('[data-yes]').onclick = () => { closeSheet(el); res(true); };
    el.addEventListener('click', e => { if (e.target === el) res(false); });

      <div class="sec" style="margin-top:12px"><h3>All results</h3>${hist.length ? hist.map(x => `<div class="hrow"><span>${kFull(x.d)}</span><b class="${flagOf(tt, x.v)} ${x.c ? 'mk-' + x.c : ''}">${esc(x.v)}</b></div>`).join('') : '<div class="hint">No result yet.</div>'}</div>`;
  };
  draw();
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-mk]'); if (!b) return;
    const day = p.labs[sel] = p.labs[sel] || {}, x = day[tid] = day[tid] || {};
    if (b.dataset.mk) x.c = b.dataset.mk; else delete x.c;
    if (!has(x.v) && !x.c) delete day[tid];
    if (!Object.keys(day).length) delete p.labs[sel];
    save(); draw(); route();
  });
  el.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.group === 'mkcol'){ sel = e.target.dataset.value; draw(); return; }
    if (e.target.id !== 'labstar') return;
    p.labStar = p.labStar.filter(x => x !== tid); if (e.target.checked) p.labStar.push(tid);
    save(); route();

        <label class="mini"><span>Low</span><input value="${has(t.lo) ? t.lo : ''}" data-tf="lo" data-t="${t.id}" inputmode="decimal" autocomplete="off"></label>
        <label class="mini"><span>High</span><input value="${has(t.hi) ? t.hi : ''}" data-tf="hi" data-t="${t.id}" inputmode="decimal" autocomplete="off"></label>
      </div>`).join('')}
      <button class="btn ghost sm" data-addt="${g.id}" style="margin-top:6px">${ic('plus')} Add test</button></div>`).join('');
  };
  draw();
  el.addEventListener('change', e => {
    const d = e.target.dataset;
    if (d.gname){ const g = S.labDefs.find(x => x.id === d.gname), v = e.target.value.trim(); if (v) g.name = v; else e.target.value = g.name; save(); }
    if (d.tf){
      const t = testById(d.t), v = e.target.value.trim();
      if (d.tf === 'lo' || d.tf === 'hi'){
        if (v === '') t[d.tf] = '';
        else if (num(v) === null){ e.target.value = has(t[d.tf]) ? t[d.tf] : ''; return toast('Type a number'); }
        else t[d.tf] = num(v);
      } else if (d.tf === 'name'){ if (v) t.name = v; else e.target.value = t.name; }
      else t[d.tf] = v;
      save();
    }
  });

    const at = e.target.closest('[data-addt]');
    if (at){
      S.labDefs.find(x => x.id === at.dataset.addt).tests.push({id:uid(), name:'New test', unit:'', lo:'', hi:''});
      save(); draw();
      const grp = [...el.querySelectorAll('.ldg')][S.labDefs.findIndex(x => x.id === at.dataset.addt)];
      const n = grp.querySelectorAll('.ldt .n'); const last = n[n.length - 1]; last.focus(); last.select();
    }
    const dt = e.target.closest('[data-delt]');
    if (dt){
      const t = testById(dt.dataset.delt);
      if (!(await confirmBox(`Delete test “${t.name}”?`, 'Delete', true, 'Results already written for this test will be hidden.'))) return;
      S.labDefs.forEach(g => g.tests = g.tests.filter(x => x.id !== t.id)); save(); draw();
    }
    const dg = e.target.closest('[data-delg]');
    if (dg){
      const g = S.labDefs.find(x => x.id === dg.dataset.delg);
      if (!(await confirmBox(`Delete group “${g.name}” and its ${g.tests.length} tests?`, 'Delete', true))) return;
      S.labDefs = S.labDefs.filter(x => x !== g); save(); draw();
    }
    if (e.target.closest('#addgroup')){
      const inp = el.querySelector('#newgroup'), v = inp.value.trim();
      if (!v) return toast('Type a group name');
      S.labDefs.push({id:uid(), name:v, tests:[{id:uid(), name:'New test', unit:'', lo:'', hi:''}]}); inp.value = ''; save(); draw();
    }
  });
}

        <datalist id="orglist">${ORGANISMS.map(o => `<option value="${esc(o)}">`).join('')}</datalist>
        <label class="f"><span>Colony count / comment</span><input name="count" value="${esc(v.count)}" placeholder="e.g. >10⁵ CFU/mL, Gram-negative bacilli" autocomplete="off"></label>
        <div class="f"><span>Sensitivity — tap again to change: S → I → R → off</span><div class="abxpick">${names.map(abc).join('')}</div></div>
        <div class="bedrow"><input id="newabx" placeholder="Other antibiotic" autocomplete="off" style="flex:1;width:auto"><button type="button" class="btn ghost" id="addabx">${ic('plus')} Add</button></div>

  };
}

function openPatientForm({bedId = null, p = null} = {}){
  const isNew = !p, t = todayStr();
  const v = p || {status:'serious', source:'Emergency', hospDate:t, icuDate:t, dengue:{on:false, onset:'', lastFever:''}};
  const ettOn = !!(p && p.ett && !p.ett.ext);
  const dg = v.dengue || {};
  const fb = freeBeds();
  if (isNew && !fb.length){ toast('No empty bed. Add a bed first.'); return; }
  const el = sheet(`
    <div class="sh-head"><h2>${isNew ? 'New admission' : 'Edit patient'}</h2><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="sh-body">
      ${isNew ? `<label class="f"><span>Bed</span><select name="bed">${fb.map(b => `<option value="${b.id}" ${b.id === bedId ? 'selected' : ''}>${esc(b.no)}</option>`).join('')}</select></label>` : ''}
      <label class="f"><span>Name / Initials</span><input name="name" value="${esc(v.name || '')}" placeholder="e.g. AK or Abdul Karim" autocomplete="off"></label>
      <div class="row2">
        <label class="f"><span>Age</span><input name="age" value="${esc(v.age || '')}" placeholder="e.g. 45Y" autocomplete="off"></label>
        <div class="f"><span>Sex</span>${chips('sex', [['M','Male'],['F','Female']], v.sex)}</div>
      </div>
      <label class="f"><span>Diagnosis</span><input name="dx" value="${esc(v.dx || '')}" placeholder="Short diagnosis" autocomplete="off"></label>
      <div class="f"><span>Condition</span>${chips('status', [['critical','Critical'],['serious','Serious'],['stable','Stable']], v.status, true)}</div>
      <div class="f"><span>Tags</span>${tagPick(v.tags || [])}</div>
      <div class="f"><span>Came to ICU from</span>${chips('source', SOURCES.map(s => [s, s]), v.source)}</div>
      <div class="row2">
        <label class="f"><span>Hospital admission</span><input type="date" name="hosp" value="${esc(v.hospDate || '')}" max="${t}"></label>
        <label class="f"><span>ICU admission</span><input type="date" name="icu" value="${esc(v.icuDate || '')}" max="${t}"></label>
      </div>
      <label class="sw"><input type="checkbox" name="ettOn" ${ettOn ? 'checked' : ''}><i></i>Intubated</label>
      <div class="sub-f" data-show="ettOn" ${ettOn ? '' : 'hidden'}><label class="f"><span>Intubation date</span><input type="date" name="ettDate" value="${esc(ettOn ? p.ett.date : t)}" max="${t}"></label></div>
      <label class="sw"><input type="checkbox" name="dengue" ${dg.on ? 'checked' : ''}><i></i>Dengue patient</label>
      <div class="sub-f" data-show="dengue" ${dg.on ? '' : 'hidden'}>
        <div class="row2">
          <label class="f"><span>Fever started</span><input type="date" name="onset" value="${esc(dg.onset || '')}" max="${t}"></label>
          <label class="f"><span>Last fever day</span><input type="date" name="lastFever" value="${esc(dg.lastFever || '')}" max="${t}"></label>
        </div>
        <div class="hint" style="margin-top:-6px">Leave "Last fever day" blank while fever continues.</div>
      </div>
    </div>
    <div class="sh-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" data-save>${isNew ? 'Admit' : 'Save'}</button></div>`);
  const f = n => el.querySelector(`[name="${n}"]`);
  const sync = () => { if (chipVal(el, 'source') === 'Emergency') f('icu').value = f('hosp').value; };
  f('hosp').addEventListener('change', sync);
  el.querySelector('[data-group="source"]').addEventListener('change', sync);
  el.querySelector('[data-save]').onclick = () => {
    const hosp = f('hosp').value, icu = f('icu').value;
    if (!hosp || !icu) return toast('Give both admission dates');
    if (icu < hosp) return toast('ICU date cannot be before hospital date');
    const eOn = f('ettOn').checked, eDate = f('ettDate').value;
    if (eOn && !eDate) return toast('Give the intubation date');
    const dOn = f('dengue').checked, onset = f('onset').value, lf = f('lastFever').value;
    if (dOn && onset && lf && lf < onset) return toast('Last fever day is before fever start');
    const obj = p || {id:uid(), plans:[], icuc:[], ettHist:[], ett:null, labs:{}, labStar:[], sero:[], biofire:[], cultures:[], consults:[], createdAt:new Date().toISOString()};
    Object.assign(obj, {name:f('name').value.trim(), age:f('age').value.trim(), sex:chipVal(el, 'sex'), dx:f('dx').value.trim(),
      status:chipVal(el, 'status') || 'serious', source:chipVal(el, 'source'), hospDate:hosp, icuDate:icu,
      tags:chipVal(el, 'tags').split(',').filter(Boolean)});
    if (isNew) obj.bedId = f('bed').value;
    if (eOn){
      if (obj.ett && !obj.ett.ext) obj.ett.date = eDate;
      else { if (obj.ett) obj.ettHist.push(obj.ett); obj.ett = {date:eDate, ext:null}; }
    } else if (obj.ett && !obj.ett.ext){
      obj.ett = obj.ettHist.pop() || null; // unticked = correction
    }
    obj.dengue = {on:dOn, onset, lastFever:lf};
    if (isNew) S.patients.push(obj);
    save(); closeSheet(el);
    if (isNew){ toast(`Admitted to bed ${bedById(obj.bedId).no}`); go('#/p/' + obj.id); } else route();
  };
}

/* ================= editor ================= */
function openEditor(p, kind, entry){
  const isC = kind === 'icuc', isK = kind === 'consults';
  const depts = [...new Set([...DEPTS, ...S.patients.flatMap(x => (x.consults || []).map(e => e.dept)).filter(Boolean)])];
  const names = [...new Set(S.patients.flatMap(x => (x.consults || []).map(e => e.by)).filter(Boolean))];
  const last = p[kind].slice().sort(byTsDesc)[0];
  const [d, tm] = entry ? [entry.ts.slice(0, 10), entry.ts.slice(11, 16)] : [todayStr(), nowTime()];
  const HL = [['#fff176','Yellow'],['#b2f2bb','Green'],['#ffc9de','Pink'],['#a5d8ff','Blue']];
  const FC = [['#f03e3e','Red'],['#fd7e14','Orange'],['#37b24d','Green'],['#339af0','Blue'],['#cc5de8','Purple']];
  let saved = null;
  const onSel = () => { const s = getSelection(); if (s.rangeCount && ed.contains(s.anchorNode)) saved = s.getRangeAt(0).cloneRange(); };
  const el = sheet(`
    <div class="sh-head"><button class="btn ghost sm" data-cancel>Cancel</button><h2 style="text-align:center">${entry ? 'Edit' : 'New'} ${isC ? 'ICU consultant note' : isK ? 'consultant note' : 'plan'}</h2><button class="btn primary sm" data-save>Save</button></div>
    <div class="ed-meta"><input type="date" name="d" value="${d}"><input type="time" name="t" value="${tm}">
      ${isC ? `<input name="by" placeholder="ICU consultant name" value="${esc(entry ? entry.by || '' : S.settings.lastBy || '')}" autocomplete="off">` : ''}
      ${isK ? `<input name="dept" list="deptlist" placeholder="Department, e.g. Nephrology" value="${esc(entry ? entry.dept || '' : '')}" autocomplete="off" style="flex-basis:100%">
        <datalist id="deptlist">${depts.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
        <input name="by" list="conslist" placeholder="Consultant name" value="${esc(entry ? entry.by || '' : '')}" autocomplete="off">
        <datalist id="conslist">${names.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}</div>
    <div class="tb">
      <button data-cmd="bold" aria-label="Bold"><b>B</b></button><button data-cmd="italic" aria-label="Italic"><i>I</i></button><button data-cmd="underline" aria-label="Underline"><u>U</u></button>
      <span class="sep"></span>
      <button class="sz s" data-cmd="fontSize" data-val="2">A</button><button class="sz m" data-cmd="fontSize" data-val="3">A</button><button class="sz l" data-cmd="fontSize" data-val="5">A</button><button class="sz xl" data-cmd="fontSize" data-val="6">A</button>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" aria-label="Bullets">${ic('list')}</button><button data-cmd="insertOrderedList" aria-label="Numbers">${ic('olist')}</button>
      <button data-cmd="clear" aria-label="Clear formatting">${ic('eraser')}</button>
    </div>
    <div class="tb">
      <span class="lb">Mark</span>${HL.map(([c, n]) => `<button class="swc" style="background:${c}" data-cmd="hiliteColor" data-val="${c}" aria-label="Mark ${n}"></button>`).join('')}
      <button class="swc" data-cmd="hiliteColor" data-val="transparent" aria-label="No mark" style="background:var(--s1)">⌀</button>
      <span class="sep"></span>
      <span class="lb">Text</span>${FC.map(([c, n]) => `<button class="swc" style="background:${c}" data-cmd="foreColor" data-val="${c}" aria-label="Text ${n}"></button>`).join('')}
    </div>
    <div class="ed rich" contenteditable="true" data-ph="${isC ? 'What the ICU consultant said / planned…' : isK ? 'Opinion and advice of the consultant…' : 'Write today\'s plan…'}"></div>
    ${!entry && last ? `<div class="sh-foot"><button class="btn ghost" data-copy>${ic('copy')} Copy last ${isC || isK ? 'note' : 'plan'} (${fmtD(last.ts.slice(0, 10), false)})</button></div>` : ''}`,
    {full:true, onClose:() => document.removeEventListener('selectionchange', onSel)});
  const ed = el.querySelector('.ed');
  ed.innerHTML = entry ? clean(entry.html) : '';
  const startHTML = ed.innerHTML;
  document.addEventListener('selectionchange', onSel);
  try { document.execCommand('styleWithCSS', false, true); } catch(e) {}
  el.querySelectorAll('.tb').forEach(tb => {
    tb.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
    tb.addEventListener('pointerdown', e => { if (e.target.closest('button')) e.preventDefault(); });
    tb.addEventListener('click', e => {
      const b = e.target.closest('[data-cmd]'); if (!b) return;
      ed.focus();
      if (saved){ const s = getSelection(); s.removeAllRanges(); s.addRange(saved); }
      const cmd = b.dataset.cmd, val = b.dataset.val;
      try { document.execCommand('styleWithCSS', false, true); } catch(err) {}
      if (cmd === 'clear'){ document.execCommand('removeFormat'); document.execCommand('hiliteColor', false, 'transparent'); }
      else if (cmd === 'hiliteColor'){ if (!document.execCommand('hiliteColor', false, val)) document.execCommand('backColor', false, val); }
      else document.execCommand(cmd, false, val || null);
      onSel();
    });
  });
  const cp = el.querySelector('[data-copy]');
  if (cp) cp.onclick = () => { ed.innerHTML = clean(last.html); if ((isC || isK) && last.by) el.querySelector('[name=by]').value = last.by; if (isK && last.dept) el.querySelector('[name=dept]').value = last.dept; toast('Copied — edit what changed'); };
  el.querySelector('[data-cancel]').onclick = async () => {
    if (ed.innerHTML !== startHTML && textOf(ed.innerHTML)){ if (!(await confirmBox('Discard what you wrote?', 'Discard', true))) return; }
    closeSheet(el);
  };
  el.querySelector('[data-save]').onclick = () => {
    const h = clean(ed.innerHTML).trim();
    if (!textOf(h)) return toast('Write something first');
    const dd = el.querySelector('[name=d]').value || todayStr(), tt = el.querySelector('[name=t]').value || nowTime();
    const by = isC || isK ? el.querySelector('[name=by]').value.trim() : '';
    const dept = isK ? el.querySelector('[name=dept]').value.trim() : undefined;
    if (isK && !dept) return toast('Give the department');
    const ts = `${dd}T${tt}`;
    if (entry) Object.assign(entry, {ts, html:h, by}, isK ? {dept} : {});
    else p[kind].push(Object.assign({id:uid(), ts, html:h, by}, isK ? {dept} : {}));
    if (isC && by) S.settings.lastBy = by;
    save(); closeSheet(el); route(); toast('Saved');
  };
  if (!entry) setTimeout(() => ed.focus(), 250);
}

/* ================= patient actions ================= */
function openPMenu(p){
  const no = bedNoOf(p);
  const el = sheet(`<div class="sh-head"><h2>Bed ${esc(no)} · ${esc(p.name || 'Unnamed')}</h2><button class="x" data-close>✕</button></div>
    <div class="menu">
      <button data-m="pdf">${ic('report')}<span>Case summary PDF<small>Send on WhatsApp, Messenger or email</small></span></button>
      <button data-m="send">${ic('send')}<span>Send today's decisions<small>WhatsApp text — plans and consultant advice of today</small></span></button>
      <button data-m="edit">${ic('edit')}<span>Edit details</span></button>
      <button data-m="move">${ic('move')}<span>Move to another bed</span></button>
      <button data-m="leave">${ic('out')}<span>Patient leaving ICU<small>Discharge · Ward transfer · Death · DAMA</small></span></button>
      <button data-m="replace">${ic('newp')}<span>New patient in this bed<small>Current patient goes to archive first</small></span></button>
      <button data-m="del" class="danger">${ic('trash')}<span>Delete record permanently</span></button>
    </div>`);
  el.addEventListener('click', e => {
    const m = e.target.closest('[data-m]')?.dataset.m; if (!m) return;
    closeSheet(el);
    setTimeout(() => {
      if (m === 'pdf') openCaseSheet({list:[p], auto:true});
      if (m === 'send') openShare([p], `Today's decisions — Bed ${bedNoOf(p)}`);
      if (m === 'edit') openPatientForm({p});
      if (m === 'move') openMove(p);
      if (m === 'leave') openLeave(p);
      if (m === 'replace') openLeave(p, true);
      if (m === 'del') delPatient(p, '#/');
    }, 230);
  });
}
function openAMenu(p){
  const el = sheet(`<div class="sh-head"><h2>${esc(p.name || 'Unnamed')}</h2><button class="x" data-close>✕</button></div>
    <div class="menu">
      <button data-m="pdf">${ic('report')}<span>Case summary PDF<small>As on the day of leaving ICU</small></span></button>
      <button data-m="restore">${ic('restore')}<span>Bring back to a bed<small>If admitted again or archived by mistake</small></span></button>
      <button data-m="del" class="danger">${ic('trash')}<span>Delete record permanently</span></button>
    </div>`);
  el.addEventListener('click', e => {
    const m = e.target.closest('[data-m]')?.dataset.m; if (!m) return;
    closeSheet(el);
    setTimeout(() => { if (m === 'pdf') openCaseSheet({list:[p], date:p.discharge.date, auto:true}); if (m === 'restore') openRestore(p); if (m === 'del') delPatient(p, '#/archive'); }, 230);
  });
}
async function delPatient(p, back){
  if (!(await confirmBox(`Delete ${p.name || 'this patient'} permanently?`, 'Delete', true, 'All plans and notes of this patient will be removed. This cannot be undone.'))) return;
  S.patients = S.patients.filter(x => x !== p); save(); toast('Deleted'); go(back);
}
function bedPicker(title, sub, onPick){
  const fb = freeBeds();
  if (!fb.length){ toast('No empty bed'); return; }
  const el = sheet(`<div class="sh-head"><h2>${esc(title)}</h2><button class="x" data-close>✕</button></div>${sub ? `<div class="sh-sub">${esc(sub)}</div>` : ''}
    <div class="sh-body"><div class="pickgrid">${fb.map(b => { const [g1, g2] = bedColor(b); return `<button style="--g1:${g1};--g2:${g2}" data-pick="${b.id}">${esc(b.no)}</button>`; }).join('')}</div></div>`);
  el.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b){ closeSheet(el); onPick(b.dataset.pick); } });
}
function openMove(p){
  bedPicker('Move to which bed?', `Now in bed ${bedNoOf(p)}. All plans and notes move with the patient.`, id => {
    p.bedId = id; save(); route(); toast(`Moved to bed ${bedById(id).no}`);
  });
}
function openRestore(p){
  bedPicker('Bring back to which bed?', 'Old plans and notes stay with the patient.', id => {
    (p.pastStays = p.pastStays || []).push(p.discharge);
    p.discharge = null; p.bedId = id; save(); toast(`Back in bed ${bedById(id).no}`); go('#/p/' + p.id);
  });
}
function openLeave(p, replace = false){
  const bed = bedById(p.bedId), t = todayStr();
  const el = sheet(`<div class="sh-head"><h2>${replace ? `Bed ${esc(bed.no)}: previous patient leaving` : 'Patient leaving ICU'}</h2><button class="x" data-close>✕</button></div>
    <div class="sh-sub">${esc(p.name || 'Unnamed')} · ICU from ${fmtD(p.icuDate)}. The record goes to the archive.</div>
    <div class="sh-body">
      <div class="f"><span>Reason</span>${chips('oc', OUTCOMES.map(o => [o, o]), '')}</div>
      <div class="row2"><label class="f"><span>Date</span><input type="date" name="d" value="${t}" max="${t}"></label><label class="f"><span>Time</span><input type="time" name="t" value="${nowTime()}"></label></div>
      <label class="f"><span>Note (optional)</span><textarea name="note" placeholder="e.g. transferred to Medicine ward"></textarea></label>
    </div>
    <div class="sh-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" data-save>${replace ? 'Next: new patient' : 'Confirm'}</button></div>`);
  el.querySelector('[data-save]').onclick = () => {
    const oc = chipVal(el, 'oc'), d = el.querySelector('[name=d]').value;
    if (!oc) return toast('Choose a reason');
    if (!d) return toast('Give the date');
    if (p.icuDate && d < p.icuDate) return toast('Date is before ICU admission');
    p.discharge = {outcome:oc, date:d, time:el.querySelector('[name=t]').value, note:el.querySelector('[name=note]').value.trim(), bedNo:bed ? bed.no : '?'};
    p.bedId = null; save(); closeSheet(el);
    toast(`${p.name || 'Patient'} moved to archive`);
    go('#/');
    if (replace && bed) setTimeout(() => openPatientForm({bedId:bed.id}), 260);
  };
}
function openStatus(p){
  const el = sheet(`<div class="sh-head"><h2>Condition</h2><button class="x" data-close>✕</button></div>
    <div class="sh-body">${chips('st', [['critical','Critical'],['serious','Serious'],['stable','Stable']], p.status, true)}</div>`);
  el.querySelector('[data-group=st]').addEventListener('change', e => { p.status = e.currentTarget.dataset.value; save(); closeSheet(el); route(); });
}
function openDateAsk(title, min, onOk){
  const t = todayStr();
  const el = sheet(`<div class="sh-head"><h2>${esc(title)}</h2><button class="x" data-close>✕</button></div>
    <div class="sh-body"><label class="f"><span>Date</span><input type="date" name="d" value="${t}" max="${t}" ${min ? `min="${min}"` : ''}></label></div>
    <div class="sh-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" data-save>Save</button></div>`);

    <div class="sh-sub">Tap to put a tag on or take it off.</div>

  el.querySelector('[data-manage]').onclick = () => { closeSheet(el); setTimeout(() => openTags(() => openPTags(p)), 230); };

function openTags(after){
  const el = sheet(`<div class="sh-head"><h2>Tags</h2><button class="x" data-close>✕</button></div>
    <div class="sh-sub">Rename by typing over a tag. Tap the colour dot to change colour. Deleting a tag takes it off every patient.</div>
    <div class="sh-body"><div id="taglist"></div>
      <div class="bedrow" style="margin-top:14px"><input id="newtag" placeholder="New tag name" autocomplete="off" style="flex:1;width:auto"><button class="btn primary" id="addtag">${ic('plus')} Add</button></div>
    </div>`, {onClose:() => { if (after) setTimeout(after, 230); }});
  const used = id => S.patients.filter(p => !p.discharge && (p.tags || []).includes(id)).length;
  const draw = () => {
    el.querySelector('#taglist').innerHTML = S.tags.map(t => `<div class="bedrow">
      <button class="cdot" style="background:${t.color}" data-cyc="${t.id}" aria-label="Change colour"></button>
      <input value="${esc(t.name)}" data-tagin="${t.id}" autocomplete="off" style="flex:1;width:auto">
      <span class="occ" style="flex:none">${used(t.id)} pt</span>
      <button class="ibtn del" data-deltag="${t.id}" aria-label="Delete tag">${ic('trash')}</button></div>`).join('') || '<div class="emptystate">No tags. Add one below.</div>';
  };
  draw();
  el.addEventListener('change', e => {
    const id = e.target.dataset.tagin; if (!id) return;
    const t = tagById(id), v = e.target.value.trim();
    if (!v){ e.target.value = t.name; return toast('Tag name cannot be empty'); }
    if (S.tags.some(x => x.id !== id && x.name.toLowerCase() === v.toLowerCase())){ e.target.value = t.name; return toast('That tag already exists'); }
    t.name = v; save(); route(); toast('Tag renamed');
  });
  el.addEventListener('click', async e => {
    const cy = e.target.closest('[data-cyc]');
    if (cy){ const t = tagById(cy.dataset.cyc); t.color = TAG_COLORS[(TAG_COLORS.indexOf(t.color) + 1) % TAG_COLORS.length]; save(); draw(); route(); }
    const dl = e.target.closest('[data-deltag]');
    if (dl){
      const t = tagById(dl.dataset.deltag), n = used(t.id);
      if (!(await confirmBox(`Delete tag “${t.name}”?`, 'Delete', true, n ? `It will be taken off ${n} patient${n > 1 ? 's' : ''}.` : ''))) return;
      S.tags = S.tags.filter(x => x !== t);
      S.patients.forEach(p => { p.tags = (p.tags || []).filter(x => x !== t.id); });
      if (S.settings.tagFilter === t.id) S.settings.tagFilter = '';
      save(); draw(); route();
    }
    if (e.target.closest('#addtag')){
      const inp = el.querySelector('#newtag'), v = inp.value.trim();
      if (!v) return toast('Type a tag name');
      if (S.tags.some(x => x.name.toLowerCase() === v.toLowerCase())) return toast('That tag already exists');
      S.tags.push({id:uid(), name:v, color:TAG_COLORS[S.tags.length % TAG_COLORS.length]});
      save(); inp.value = ''; draw(); route(); toast(`Tag “${v}” added`);
    }
  });
}

/* ================= WhatsApp text ================= */
function htmlToText(html){
  const root = new DOMParser().parseFromString(`<div>${clean(html)}</div>`, 'text/html').body.firstChild;
  let out = '';
  const nl = () => { if (out && !out.endsWith('\n')) out += '\n'; };
  const walk = n => {
    for (const c of n.childNodes){
      if (c.nodeType === 3){ out += c.nodeValue; continue; }
      if (c.nodeType !== 1) continue;
      const tag = c.tagName;
      if (tag === 'BR'){ out += '\n'; continue; }
      if (tag === 'UL' || tag === 'OL'){
        nl(); let i = 0;
        for (const li of c.children){ i++; out += tag === 'OL' ? i + '. ' : '• '; walk(li); nl(); }
        continue;
      }
      const block = tag === 'DIV' || tag === 'P' || tag === 'LI';
      if (block) nl();
      const fw = (c.style && c.style.fontWeight) || '';

  if (c.dengue) bits.push('Dengue D' + c.dengue); if (c.afeb != null) bits.push('Afebrile D' + c.afeb);
  const sec = (title, inner) => inner ? `<div class="rp-sec"><h4>${title}</h4>${inner}</div>` : '';
  const notes = (arr, who) => onDay(arr, date).map(e => `<div class="rp-note">${who(e) ? `<div class="rp-by">${esc(who(e))} · ${esc(e.ts.slice(11, 16))}</div>` : ''}<div class="rich">${clean(e.html)}</div></div>`).join('');
  // labs of this date: morning and evening, with the last earlier value
  const am = p.labs[date] || {}, pm = p.labs[date + '~pm'] || {};
  const prevKey = labDates(p).filter(k => kDate(k) < date).pop();
  const prev = prevKey ? p.labs[prevKey] : {};
  const hasPM = Object.keys(pm).length > 0;
  let rows = '';
  S.labDefs.forEach(g => g.tests.forEach(t => {
    const a = (am[t.id] || {}).v, b = (pm[t.id] || {}).v; if (!has(a) && !has(b)) return;
    const pv = (prev[t.id] || {}).v;
    const cell = (v, x) => `<td class="${flagOf(t, v)} ${x && x.c ? 'mk-' + x.c : ''}">${has(v) ? esc(v) : ''}</td>`;
    rows += `<tr><th>${esc(t.name)}${t.unit ? ` <small>${esc(t.unit)}</small>` : ''}</th><td class="pv">${has(pv) ? esc(pv) : ''}</td>${cell(a, am[t.id])}${hasPM ? cell(b, pm[t.id]) : ''}</tr>`;
  }));
  const labs = rows ? `<table class="rp-lab"><thead><tr><th></th><th>${prevKey ? kLabel(prevKey, true) : 'Earlier'}</th><th>${hasPM ? 'Morning' : fmtD(date, false)}</th>${hasPM ? '<th>Evening</th>' : ''}</tr></thead><tbody>${rows}</tbody></table>` : '';
  const cs = p.cultures.filter(x => x.date === date || x.rdate === date || x.status === 'Pending').map(x =>
    `<div class="rp-line"><b>${esc(x.type)}</b> (sent ${fmtD(x.date, false)}) — ${esc(x.status)}${x.org ? ': <i>' + esc(x.org) + '</i>' : ''}${(x.abx || []).length ? `<div class="rp-abx">${['S','I','R'].map(r => { const l = x.abx.filter(a => a.r === r).map(a => a.name); return l.length ? `<span class="ab ab-${r}">${r}: ${esc(l.join(', '))}</span>` : ''; }).join(' ')}</div>` : ''}</div>`).join('');
  const se = p.sero.filter(x => x.date === date).map(x => { const d = S.seroDefs.find(y => y.id === x.tid); return `<span class="rp-sero">${esc(d ? d.name : 'Test')}: <b class="r-${x.result.toLowerCase()}">${esc(x.result)}</b>${x.note ? ' (' + esc(x.note) + ')' : ''}</span>`; }).join('')
    + p.biofire.filter(x => x.date === date).map(x => `<span class="rp-sero">BioFire ${esc(x.panel)}: <b>${esc(x.detected || 'Not detected')}</b>${x.genes ? ' · ' + esc(x.genes) : ''}</span>`).join('');
  return `<section class="rp-bed">
    <div class="rp-h"><span class="rp-no">${esc(bedNoOf(p))}</span><div><b>${esc(p.name || 'Unnamed')}</b> <small>${esc(p.age || '')}${esc(p.sex || '')} · ${STATUS[p.status]}</small><div class="rp-dx">${esc(p.dx || '')}</div></div></div>
    <div class="rp-meta">${bits.join(' · ')}${pTags(p).length ? ' · ' + pTags(p).map(t => esc(t.name)).join(', ') : ''}</div>
    ${sec('Plan', notes(p.plans, () => ''))}
    ${sec('Consultants', notes(p.consults, e => (e.dept || 'Consultant') + (e.by ? ' — ' + e.by : '')))}
    ${sec('Investigation', labs)}
    ${sec('Culture', cs)}
    ${sec('Serology / BioFire', se ? `<div class="rp-serol">${se}</div>` : '')}
  </section>`;
}

function openBeds(){
  const el = sheet(`<div class="sh-head"><h2>Manage beds</h2><button class="x" data-close>✕</button></div>
    <div class="sh-sub">Change a bed number by typing over it. A bed can be deleted only when empty.</div>

    </div>`);
  const draw = () => {
    el.querySelector('#bedlist').innerHTML = S.beds.slice().sort((a, b) => numCmp(a.no, b.no)).map(b => {
      const p = occupant(b.id);
      return `<div class="bedrow"><input value="${esc(b.no)}" data-bedin="${b.id}" autocomplete="off"><span class="occ ${p ? 'o' : ''}">${p ? esc(p.name || 'Patient') : 'Empty'}</span><button class="ibtn del" data-delbed="${b.id}" aria-label="Delete bed">${ic('trash')}</button></div>`;
    }).join('') || '<div class="emptystate">No beds.</div>';
  };
  draw();
  el.addEventListener('change', e => {
    const id = e.target.dataset.bedin; if (!id) return;
    const v = e.target.value.trim(), b = bedById(id);
    if (!v){ e.target.value = b.no; return toast('Bed number cannot be empty'); }
    if (S.beds.some(x => x.id !== id && x.no.toLowerCase() === v.toLowerCase())){ e.target.value = b.no; return toast('That bed number already exists'); }
    b.no = v; save(); route(); toast('Bed number changed');
  });
  el.addEventListener('click', async e => {
    const db = e.target.closest('[data-delbed]');
    if (db){
      const b = bedById(db.dataset.delbed);
      if (occupant(b.id)) return toast('Move or discharge the patient first');
      if (!(await confirmBox(`Delete bed ${b.no}?`, 'Delete', true))) return;
      S.beds = S.beds.filter(x => x !== b); save(); draw(); route();
    }
    if (e.target.closest('#addbed')){
      const inp = el.querySelector('#newbed'), v = inp.value.trim();
      if (!v) return toast('Type a bed number');
      if (S.beds.some(x => x.no.toLowerCase() === v.toLowerCase())) return toast('That bed number already exists');
      S.beds.push({id:uid(), no:v}); save(); inp.value = ''; draw(); route(); toast(`Bed ${v} added`);
    }
  });
}

  el.addEventListener('click', e => {

    if (th){ S.settings.theme = th.dataset.th; save(); applySettings(); draw(); route(); }
    const sc = e.target.closest('[data-scale]');
    if (sc){ S.settings.scale = Math.min(130, Math.max(85, S.settings.scale + Number(sc.dataset.scale))); save(); applySettings(); draw(); }
    if (e.target.closest('[data-tagmgr]')){ closeSheet(el); setTimeout(() => openTags(), 230); }
    if (e.target.closest('[data-casepdf]')){ closeSheet(el); setTimeout(() => openCaseSheet(), 230); }
    if (e.target.closest('[data-labmgr]')){ closeSheet(el); setTimeout(() => openLabDefs(), 230); }
    if (e.target.closest('[data-bk]')) doBackup().then(draw);
    if (e.target.closest('[data-rs]')) el.querySelector('#rsfile').click();
  });
  el.addEventListener('change', e => {
    const g = e.target.dataset && e.target.dataset.group;
    if (g === 'font'){ S.settings.font = e.target.dataset.value; save(); applySettings(); route(); }
    if (g === 'bold'){ S.settings.bold = e.target.dataset.value === '1'; save(); applySettings(); route(); }
    if (e.target.id === 'rsfile' && e.target.files[0]) doRestore(e.target.files[0], el);
  });

async function doBackup(){
  if (IS_PREVIEW){ toast('Backup file works in the installed app, not in this preview'); return; }
  const data = JSON.stringify({app:'icu-round', v:1, exported:new Date().toISOString(), data:S});
  const name = `ICU-Round-backup-${todayStr()}.json`;
  const file = new File([data], name, {type:'application/json'});
  const mark = () => { S.settings.lastBackup = todayStr(); save(); route(); toast('Backup saved'); };
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file]}); mark(); return; }
    catch(e){ if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  mark();
}
async function doRestore(file, sheetEl){
  try {
    const obj = JSON.parse(await file.text());
    const data = obj && obj.app === 'icu-round' ? obj.data : obj;
    if (!data || !Array.isArray(data.beds)) throw new Error('bad');
    const n = (data.patients || []).length;
    if (!(await confirmBox('Replace all data with this backup?', 'Restore', true, `Backup has ${data.beds.length} beds and ${n} patient records. Current data on this phone will be replaced.`))) return;
    S = migrate(data); save(); applySettings(); closeSheet(sheetEl); go('#/'); route(); toast('Backup restored');
  } catch(e){ toast('This is not an ICU Round backup file'); }
}

    case 'size': S.settings.card = d.v; save(); route(); break;

    case 'amenu': openAMenu(p); break;

    case 'editEntry': openEditor(p, d.kind, p[d.kind].find(x => x.id === d.e)); break;

      confirmBox('Delete this entry?', 'Delete', true).then(ok => { if (ok){ p[d.kind] = p[d.kind].filter(x => x.id !== d.e); save(); route(); } });
      break;

      openDateAsk('Intubation date', p.ett && p.ett.ext ? p.ett.ext : p.hospDate, date => {

    case 'culture': openCulture(p, d.c ? p.cultures.find(x => x.id === d.c) : null); break;

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[role=button], .arow')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.classList.contains('lin')){
    e.preventDefault();
    const all = [...view.querySelectorAll(`.lin[data-k="${e.target.dataset.k}"]`)], i = all.indexOf(e.target), next = all[i + 1];
    if (next){ const g = next.closest('details'); if (g && !g.open) g.open = true; next.focus(); next.select(); } else e.target.blur();
  }
});
document.addEventListener('toggle', e => { const g = e.target.dataset && e.target.dataset.g; if (g) UI.closed[g] = !e.target.open; }, true);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rpdate'){ if (t.value){ UI.reportDate = t.value; route(); } return; }
  if (t.classList.contains('lin')){
    const p = getP(t.dataset.id), d = t.dataset.k, tid = t.dataset.lab, v = t.value.trim();
    const day = p.labs[d] = p.labs[d] || {};
    if (v) day[tid] = Object.assign(day[tid] || {}, {v});
    else if (day[tid]){ delete day[tid].v; if (!day[tid].c) delete day[tid]; }
    if (!Object.keys(day).length) delete p.labs[d];
    save();
    const tt = testById(tid); t.classList.remove('hi', 'lo'); const fl = flagOf(tt, v); if (fl) t.classList.add(fl);
    const rin = [...t.closest('.lrow').querySelectorAll('.lin')];
    rin.forEach((x, i) => { x.previousElementSibling.textContent = i ? arrowOf(x.value.trim(), rin[i - 1].value.trim()) : ''; });
    const g = t.closest('.lgrp'), ins = [...g.querySelectorAll('.lcell:last-child .lin')];
    g.querySelector('summary small').textContent = `${ins.filter(x => x.value.trim()).length}/${ins.length}`;
    return;
  }
  if (t.dataset.dtoggle){ const p = getP(t.dataset.dtoggle); p.dengue = p.dengue || {}; p.dengue.on = t.checked; save(); route(); }
  if (t.dataset.dfield){
    const p = getP(t.dataset.id), f = t.dataset.dfield;
    const other = f === 'onset' ? p.dengue.lastFever : p.dengue.onset;
    if (t.value && other && ((f === 'onset' && t.value > other) || (f === 'lastFever' && t.value < other))){ toast('Last fever day cannot be before fever start'); route(); return; }
    p.dengue[f] = t.value; save(); route();
  }
});

// refresh day counters when the app comes back after midnight
let shownDay = todayStr();
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayStr() !== shownDay){ shownDay = todayStr(); route(); } });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
